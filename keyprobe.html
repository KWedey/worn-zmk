<meta charset="utf-8">
<title>Key Probe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#E6E9EE;--panel:#F3F5F8;--cap:#FCFDFE;--ink:#18202B;--ink2:#525E70;--muted:#8B95A4;
 --line:#C9D0DA;--accent:#A05C1D;--accent2:#7C4512;--soft:#F0E1CF;
 --ok:#1F6B47;--ok-soft:#DCEFE4;--bad:#962929;--bad-soft:#F7DEDE;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#12161C;--panel:#1C222B;--cap:#2B333E;--ink:#E9EDF3;--ink2:#AEB9C7;--muted:#727E8D;
 --line:#2F3843;--accent:#E0A163;--accent2:#F0C193;--soft:#3B2C1B;
 --ok:#7FD1A8;--ok-soft:#17301F;--bad:#F0A0A0;--bad-soft:#341C1C;}}
:root[data-theme="dark"]{--bg:#12161C;--panel:#1C222B;--cap:#2B333E;--ink:#E9EDF3;--ink2:#AEB9C7;
 --muted:#727E8D;--line:#2F3843;--accent:#E0A163;--accent2:#F0C193;--soft:#3B2C1B;
 --ok:#7FD1A8;--ok-soft:#17301F;--bad:#F0A0A0;--bad-soft:#341C1C;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(30px,4.5vw,44px);margin:4px 0 8px;letter-spacing:-.02em}
.sub{color:var(--ink2);max-width:62ch;margin:0 0 26px}
.stage{background:var(--panel);border:2px dashed var(--line);border-radius:13px;padding:28px 24px;margin-bottom:16px;text-align:center;outline:none}
.stage.armed{border-style:solid;border-color:var(--accent);background:var(--soft)}
.stepno{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2)}
.press{font-family:"Bricolage Grotesque",sans-serif;font-size:27px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.on{color:var(--ink2);font-size:14px;margin:0}
.ctl{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{font-family:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:8px;
 border:1px solid var(--line);background:var(--cap);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#1A1206}}
:root[data-theme="dark"] button.primary{color:#1A1206}
ol.steps{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:7px}
ol.steps li{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:9px;
 background:var(--panel);border:1px solid var(--line);font-size:14px}
ol.steps li.cur{border-color:var(--accent);background:var(--soft)}
ol.steps li .st{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;
 display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
ol.steps li.pass .st{background:var(--ok);border-color:var(--ok);color:var(--bg)}
ol.steps li.fail .st{background:var(--bad);border-color:var(--bad);color:var(--bg)}
ol.steps li .lb{font-family:"JetBrains Mono",monospace;font-size:12.5px}
ol.steps li .wh{margin-left:auto;color:var(--muted);font-size:12px}
.verdict{padding:17px 19px;border-radius:11px;font-size:15px;display:none;border:1px solid}
.verdict.show{display:block}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.verdict h2{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;margin:0 0 7px}
.verdict b{font-family:"JetBrains Mono",monospace}
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:18px}
table{width:100%;border-collapse:collapse;font-family:"JetBrains Mono",monospace;font-size:12.5px}
th{text-align:left;padding:9px 13px;background:var(--cap);border-bottom:1px solid var(--line);
 font-family:"Public Sans",sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
td{padding:8px 13px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.empty{padding:22px;text-align:center;color:var(--muted);font-family:"Public Sans",sans-serif;font-size:14px}
</style>
<div class="wrap">
  <span class="eyebrow">Worn · diagnostic</span>
  <h1>Key Probe</h1>
  <p class="sub">Three presses, in order. Each one narrows down what is eating the combo. The box must stay highlighted — if you click away, click it again.</p>

  <ol class="steps" id="steps"></ol>

  <div class="stage" id="stage" tabindex="0">
    <div class="stepno" id="stepno">Step 1 of 3</div>
    <p class="press" id="press">Click here to start</p>
    <p class="on" id="on"></p>
    <div class="ctl">
      <button type="button" class="primary" id="nope">Didn't work — next</button>
      <button type="button" id="restart">Start over</button>
    </div>
  </div>

  <div class="verdict" id="verdict"></div>

  <div class="tblwrap">
    <table>
      <thead><tr><th style="width:30%">step</th><th style="width:28%">event.code</th><th>modifiers seen</th></tr></thead>
      <tbody id="log"><tr><td colspan="3" class="empty">Nothing captured yet.</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const STEPS=[
 {lb:"Enter",        on:"on the Worn",                    need:e=>e.code==="Enter"&&!e.ctrlKey},
 {lb:"Ctrl + Enter", on:"on the Worn",                    need:e=>e.code==="Enter"&&e.ctrlKey},
 {lb:"Ctrl + Enter", on:"on the MacBook's own keyboard",  need:e=>e.code==="Enter"&&e.ctrlKey}];
const R=Array(3).fill(null), CODES=Array(3).fill(null);
let i=0, armed=false, logged=0;
const $=id=>document.getElementById(id);
const stage=$("stage"),stepsEl=$("steps"),verdict=$("verdict"),log=$("log");
STEPS.forEach((s,n)=>{
  const li=document.createElement("li");
  li.innerHTML='<span class="st"></span><span class="lb"></span><span class="wh"></span>';
  li.querySelector(".lb").textContent=s.lb;
  li.querySelector(".wh").textContent=s.on;
  stepsEl.appendChild(li);
});
function paint(){
  [...stepsEl.children].forEach((li,n)=>{
    li.className = R[n]===true?"pass" : R[n]===false?"fail" : n===i?"cur":"";
    li.querySelector(".st").textContent = R[n]===true?"✓" : R[n]===false?"✕" : "";
  });
  if(i>=3){ $("stepno").textContent="Done"; $("press").textContent="All three recorded"; $("on").textContent=""; return; }
  $("stepno").textContent="Step "+(i+1)+" of 3";
  $("press").textContent=armed?STEPS[i].lb:"Click here to start";
  $("on").textContent=armed?STEPS[i].on:"";
}
function arm(v){armed=v;stage.classList.toggle("armed",v);paint();}
stage.onclick=e=>{if(e.target.tagName!=="BUTTON")arm(true)};
stage.onblur=()=>arm(false);
function addLog(n,code,mods){
  if(!logged)log.innerHTML="";logged++;
  const tr=document.createElement("tr");
  tr.innerHTML="<td></td><td></td><td></td>";
  tr.children[0].textContent=STEPS[n].lb;
  tr.children[1].textContent=code;
  tr.children[2].textContent=mods;
  log.appendChild(tr);
}
function advance(){ i++; if(i===1&&R[0]===false) i=3; if(i===2&&R[1]===true) i=3; if(i>=3) judge(); paint(); }
$("nope").onclick=e=>{e.stopPropagation();if(i<5){R[i]=false;addLog(i,"(nothing arrived)","—");advance();}stage.focus();arm(true);};
$("restart").onclick=e=>{e.stopPropagation();i=0;R.fill(null);CODES.fill(null);logged=0;
  log.innerHTML='<tr><td colspan="3" class="empty">Nothing captured yet.</td></tr>';
  verdict.className="verdict";verdict.innerHTML="";stage.focus();arm(true);};
addEventListener("keydown",e=>{
  if(!armed||i>=3)return;
  e.preventDefault();
  if(!STEPS[i].need(e))return;
  const m=[e.ctrlKey&&"ctrl",e.shiftKey&&"shift",e.altKey&&"alt",e.metaKey&&"meta"].filter(Boolean).join(" + ")||"—";
  R[i]=true; CODES[i]=e.code; addLog(i,e.code,m); advance();
});
function judge(){
  const v=(c,h,b)=>{verdict.className="verdict show "+c;verdict.innerHTML="<h2>"+h+"</h2>"+b;};
  const [alone,worn,mac]=R;
  if(alone===false) return v("bad","Enter itself never arrives",
    "Plain Enter did not register, so Ctrl is not the variable. That key or the right half is sending nothing.");
  if(worn===true) return v("ok","Ctrl + Enter works after all",
    "Enter arrived with <b>ctrl</b> held, so the firmware is fine and the shortcut is being taken by the page.");
  if(mac===true) return v("bad","It is the Worn",
    "Ctrl + Enter worked on the MacBook keyboard and failed on the Worn, so nothing on the Mac is eating it. The Worn is not sending Enter while its Ctrl is held. Next step is to read what the board actually reports, with Karabiner EventViewer.");
  if(mac===false) return v("bad","It is the Mac, not the keyboard",
    "Ctrl + Enter failed on the built-in keyboard too, so the Worn is not the cause. Something running on this Mac grabs <b>ctrl + enter</b> globally before Chrome sees it.");
  v("bad","Inconclusive","Run it again and keep the box highlighted throughout.");
}
paint();
</script>
